<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blackboard Customizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <header><h1>Blackboard Customizer</h1><span class="header-label">Appearance</span></header>
      <section aria-labelledby="background-heading">
        <h2 id="background-heading">Page background</h2>
        <div class="setting-row">
          <label for="backgroundColor">Colour</label>
          <input type="color" id="backgroundColor" value="#f5f5f5" />
        </div>
        <label for="backgroundImage">Image</label>
        <input type="file" id="backgroundImage" accept="image/*" />
        <button id="removeBackgroundImage" class="text-button" type="button">Remove background image</button>
      </section>
      <section aria-labelledby="courses-heading">
        <h2 id="courses-heading">Course grid</h2>
        <label for="courseWidth">Width <output id="courseWidthValue">820px</output></label>
        <input type="range" id="courseWidth" min="500" max="1200" step="20" value="820" />
        <label for="courseOpacity">Card opacity <output id="courseOpacityValue">85%</output></label>
        <input type="range" id="courseOpacity" min="0" max="100" value="85" />
      </section>
      <footer>
        <button id="saveBackground" type="button">Save changes</button>
        <button id="resetTheme" class="secondary-button" type="button">Reset</button>
      </footer>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
